name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Repo tidy dry run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_MCP_URL: ${{ secrets.GITHUB_MCP_URL }}
          GITHUB_MCP_PAT: ${{ secrets.GITHUB_MCP_PAT }}
          REPO_TIDY_SANDBOX_REPO: ${{ vars.REPO_TIDY_SANDBOX_REPO }}
        run: |
          npx tsx cmd/repo-tidy.ts --repo "$REPO_TIDY_SANDBOX_REPO" --dry-run --yes --output json

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-tidy-audit
          path: .repo-tidy/last_run.json
