name: Repo Tidy CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-reasoning' }}
      GITHUB_MCP_URL: ${{ secrets.GITHUB_MCP_URL }}
      GITHUB_MCP_PAT: ${{ secrets.GITHUB_MCP_PAT }}
      SANDBOX_REPO: ${{ vars.REPO_TIDY_SANDBOX_REPO || 'octocat/Hello-World' }}
      REPO_TIDY_ASSUME_YES: 'true'
      REPO_TIDY_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Repo Tidy dry-run audit
        run: npx tsx cmd/repo-tidy.ts --repo "${SANDBOX_REPO}" --dry-run --yes --output both
      - name: Upload Repo Tidy audit
        uses: actions/upload-artifact@v4
        with:
          name: repo-tidy-audit
          path: .repo-tidy/last_run.json
          if-no-files-found: error
